<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>its1jun</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>

  <!-- 페이지 내용 자리: js/core/page-router.js 가 주소의 #이름 에 맞는 pages/이름/이름.html 로 채움 -->
  <main id="page-view"></main>

  <!-- 음악 플레이어 (왼쪽 아래): components/music-player/ 를 로더가 이 자리에 채움 -->
  <div data-component="music-player"></div>

  <!-- 사이트 메뉴 (오른쪽 아래): components/site-menu/ 를 로더가 이 자리에 채움 -->
  <div data-component="site-menu"></div>

  <!-- 별똥별 배경: components/shooting-stars/ 를 로더가 이 자리에 채움 -->
  <div data-component="shooting-stars"></div>

  <script src="js/core/component-loader.js"></script>
  <script src="js/core/page-router.js"></script>
</body>
</html>
