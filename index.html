<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>첫 사이트 🎉</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitle {
      color: #888;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .counter-box {
      background: #f5f5f5;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .counter-number {
      font-size: 48px;
      font-weight: bold;
      color: #667eea;
      margin-bottom: 5px;
    }

    .counter-label {
      color: #888;
      font-size: 13px;
    }

    button {
      background: #667eea;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin: 5px;
      transition: transform 0.2s, background 0.2s;
    }

    button:hover {
      background: #5568d3;
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }

    .reset-btn {
      background: #ccc;
    }

    .reset-btn:hover {
      background: #bbb;
    }

    .footer {
      margin-top: 30px;
      color: #aaa;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>안녕! 👋</h1>
    <p class="subtitle">이건 내가 만든 첫 번째 사이트야</p>

    <div class="counter-box">
      <div class="counter-number" id="count">0</div>
      <div class="counter-label">버튼을 눌러봐</div>
    </div>

    <button onclick="increase()">+ 1</button>
    <button class="reset-btn" onclick="reset()">초기화</button>

    <div class="footer">GitHub Pages로 배포됨 ✨</div>
  </div>

  <script>
    let count = 0;
    const countDisplay = document.getElementById('count');

    function increase() {
      count++;
      countDisplay.textContent = count;
    }

    function reset() {
      count = 0;
      countDisplay.textContent = count;
    }
  </script>
</body>
</html>
