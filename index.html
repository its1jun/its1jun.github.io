<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Site</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/music-player.css">
  <link rel="stylesheet" href="css/settings-menu.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>

  <main>
    <h1>My Site</h1>
  </main>

  <!-- 음악 플레이어 (왼쪽 아래) -->
  <section class="player" aria-label="음악 플레이어">
    <p class="player-title" id="title">불러오는 중…</p>
    <input class="player-seek" id="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="재생 위치">
    <div class="player-time">
      <span id="current">0:00</span>
      <span id="duration">0:00</span>
    </div>
    <div class="player-buttons">
      <button id="prev" type="button" aria-label="이전 곡">⏮</button>
      <button id="play" type="button" aria-label="재생">▶</button>
      <button id="next" type="button" aria-label="다음 곡">⏭</button>
    </div>
    <audio id="audio" preload="metadata"></audio>
  </section>

  <!-- 설정 메뉴 (오른쪽 아래) -->
  <div class="settings">
    <!-- 열림/닫힘은 JS가 .visible 클래스를 붙였다 떼서 처리함. hidden 속성은 쓰지 말 것 -->
    <div class="settings-panel" id="settings-panel">
      <h2 class="settings-heading">설정</h2>

      <div class="settings-row">
        <label class="settings-label" for="volume">
          <span>볼륨</span>
          <span class="settings-value" id="volume-value">80%</span>
        </label>
        <input class="settings-range" id="volume" type="range" min="0" max="100" value="80" step="1">
      </div>
    </div>

    <button class="settings-toggle" id="settings-toggle" type="button" aria-label="설정" aria-expanded="false" aria-controls="settings-panel">⚙</button>
  </div>

  <script src="js/music-player.js"></script>
  <script src="js/settings-menu.js"></script>
</body>
</html>
